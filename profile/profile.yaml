# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Developed a metrics collection and storage system for Linux cluster monitoring. Leveraged Bash scripts to extract, process, and store hardware and usage metrics. Deployed a Dockerized PostgreSQL database for persistent data storage. Streamlined deployment workflows through automated database provisioning and management scripts, reducing setup time. Scheduled automated data collection using Crontab.
  - name: "Java Grep App"
    git_url: "/core_java/grep"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Developed a Java application modeled after the Linux grep utility that recursively searches target directories to output lines matching a user-specified regex pattern to a destination file. Utilized Java lambdas and streams to scale the application and efficiently handle large file sizes. Built a robust test suite using JUnit, managed project dependencies with Maven, and containerized the application with Docker to publish it directly to Docker Hub for seamless deployment.
  - name: "Python analytics project"
    git_url: "/python_data_analytics"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Ingested two years of anonymous retail data from a UK-based gift shop into a Dockerized PostgreSQL database, then cleaned and transformed the dataset using Python, NumPy, and Pandas to identify strategies for driving stagnant revenue. Based on these findings, designed and delivered a stakeholder presentation that highlighted a major, untapped non-home market and outlined actionable next steps to capitalize on the opportunity.

