    #project name
  - name: "Image Filter and Effects App"
    #URL is optional
    git_url: "https://github.com/TheHub5/Computer-Photography-Final-Project"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Developed a Python-based photo editing tool with advanced colour replacement capabilities. Manipulated colour space data using NumPy and SciPy matrix transformations to isolate and replace specific colour ranges within images. Integrated a fuzzy selection feature with adjustable sensitivity thresholds for precise colour targeting. Implemented lossless upscaling algorithms based on mathematical interpolation techniques to preserve image fidelity. Designed an intuitive PySimpleGUI interface to enhance accessibility for non-technical users.
  - name: "Hospital Staffing Level AI Prediction tool"
    git_url: "https://github.com/ronaldsin/IBM-Hackathon-Granite-ER-Assistant"
    description: Led a team of 3 developers in a high-pressure hackathon environment, coordinating task delegation and sprint planning to deliver a Granite AI-powered staffing optimization tool for healthcare settings. Engineered a robust Python data pipeline to validate and standardize input data, ensuring consistency across the system. Implemented advanced prompt engineering techniques to fine-tune Granite AI responses, achieving a 25%+ reduction in average simulated patient wait times.

